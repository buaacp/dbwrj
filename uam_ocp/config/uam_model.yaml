source:
  launch: /home/zlhq/catkin_ws/src/le_arm/launch/iris_arm.launch
  xacro: /home/zlhq/catkin_ws/src/le_arm/urdf/iris_arm_base.xacro
  package_root: /home/zlhq/catkin_ws/src/le_arm
  xacro_args:
    enable_arm: "true"
    enable_cameras: "false"
generated_urdf: uam_ocp/models/generated/uam_pinocchio.urdf
base_frame: base_link
end_effector_frame: gripper_base_link
gravity: [0.0, 0.0, -9.81]
generation_policy:
  fix_rotor_joints: true
  fix_zero_range_joints: true
  fix_mimic_joints: true
  continuous_joint_bounds:
    wrist_roll_joint:
      lower: -3.141592653589793
      upper: 3.141592653589793
      status: TODO_NEEDS_CALIBRATION
      source: "Placeholder single-turn interval; Gazebo joint is continuous"
  mimic_policy:
    status: TODO_NEEDS_CALIBRATION
    source: "Mimic joints fixed at their zero pre-grasp configuration because StateMultibody requires independent coordinates"
initial_arm_configuration:
  shoulder_pan_joint: 0.0
  shoulder_lift_joint: -0.2
  elbow_joint: 0.0
  wrist_1_joint: 0.0
  wrist_roll_joint: 0.0
  left_knuckle_joint: 0.0
nonzero_validation_configuration:
  shoulder_pan_joint: 0.2
  shoulder_lift_joint: -0.5
  elbow_joint: 0.35
  wrist_1_joint: -0.2
  wrist_roll_joint: 0.25
  left_knuckle_joint: 0.1

