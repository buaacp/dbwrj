schema_version: 1
paths:
  static_trim_scenarios: uam_ocp/config/static_trim_scenarios.yaml
  task_joints: uam_ocp/config/uam_task_joints.yaml
  p2_terminal_trajectory: uam_ocp/results/p2_bulb_pregrasp/whole_body/trajectory.npz
  static_trim_results: uam_ocp/results/static_trim/trim_results.yaml
  model_urdf: uam_ocp/models/generated/uam_pinocchio.urdf
  output: results/g1_gazebo_static_hold
interfaces_file: src/uam_ocp_gazebo_bridge/config/resolved_interfaces.yaml
watchdog_file: src/uam_ocp_gazebo_bridge/config/g1_watchdog.yaml
startup:
  initial_telemetry_grace_s: 10.0
  initial_state_grace_s: 10.0
  require_clock_before_execution: true
offboard_transition:
  arm_confirm_timeout_s: 8.0
  offboard_confirm_timeout_s: 8.0
takeoff:
  transition_duration_s: 8.0
  min_transition_distance_m: 0.02
  transition_position_error_m: 0.50
  no_ascent_check_after_s: 2.0
  min_ascent_after_check_m: 0.08
  hold_ready_duration_s: 2.0
absolute_safety:
  max_distance_from_initial_m: 2.0
  max_altitude_above_initial_m: 2.0
  min_altitude_below_initial_m: 0.30
  max_roll_pitch_deg: 30.0
  max_joint_tracking_error_deg: 15.0
arm_neutralize:
  enabled: true
  duration_s: 3.0
  min_duration_s: 1.0
  stable_duration_s: 1.0
  tracking_error_deg: 15.0
  final_error_deg: 3.0
  timeout_s: 8.0
configurations: [neutral, left_offset, fully_extended, p2_terminal]
hold_setpoint_world_enu:
  position_m: [0.0, 0.0, 1.0]
  yaw_rad: 0.0
timing:
  setpoint_rate_hz: 30.0
  prestream_duration_s: 2.0
  ready_hold_duration_s: 2.0
  deploy_duration_s: 4.0
  target_hold_duration_s: 15.0
  final_hold_duration_s: 5.0
  state_timeout_s: 45.0
arm_control:
  group_velocity_joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint]
  wrist_position_joint: wrist_roll_joint
  fixed_knuckle_joint: left_knuckle_joint
  fixed_knuckle_position_rad: 0.0
  position_feedback_gain_s_inv: 2.0
  velocity_limit_rad_s:
    shoulder_pan_joint: 1.0
    shoulder_lift_joint: 1.0
    elbow_joint: 1.0
    wrist_1_joint: 1.0
    wrist_roll_joint: 1.0
    left_knuckle_joint: 1.0
readiness:
  position_error_m: 0.05
  speed_mps: 0.05
  joint_error_deg: 3.0
safety:
  position_error_m: 0.50
  roll_pitch_deg: 30.0
  joint_tracking_error_deg: 15.0
pass_thresholds:
  peak_position_error_m: 0.15
  final_hold_position_error_m: 0.05
  peak_roll_pitch_deg: 10.0
  final_speed_mps: 0.05
  max_joint_tracking_error_deg: 3.0
  offboard_must_remain_active: true
  abort_must_not_trigger: true
logging:
  console_level: WARN
  telemetry_rate_hz: 20.0
  write_csv: true
  write_npz: true
  flush_period_s: 1.0
  record_rosbag: false
